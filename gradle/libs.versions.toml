[versions]
agp = "9.2.1"
leanback = "1.2.0"
glide = "4.16.0"
room = "2.6.1"
media3 = "1.4.1"
okhttp = "4.12.0"

[libraries]
# Leanback
leanback = { group = "androidx.leanback", name = "leanback", version.ref = "leanback" }

# Glide  — "glide" seul crée un conflit avec "glide-compiler" ; on préfixe les deux
glide-core     = { group = "com.github.bumptech.glide", name = "glide",    version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# Media3 / ExoPlayer
media3-exoplayer          = { group = "androidx.media3", name = "media3-exoplayer",          version.ref = "media3" }
media3-exoplayer-hls      = { group = "androidx.media3", name = "media3-exoplayer-hls",      version.ref = "media3" }
media3-ui                 = { group = "androidx.media3", name = "media3-ui",                 version.ref = "media3" }
media3-datasource-okhttp  = { group = "androidx.media3", name = "media3-datasource-okhttp",  version.ref = "media3" }

# OkHttp  — même logique : pas d'alias seul "okhttp" pour éviter futur conflit
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
